[project]
name = "internet-monitor-cli"
version = "1.0.0"
description = "Command-line interface for Internet Monitor"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
internet-monitor = "internet_monitor_cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["internet_monitor_cli*"]
